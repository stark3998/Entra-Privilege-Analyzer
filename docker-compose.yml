services:
  backend:
    build:
      context: ./backend
      target: dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_HOST=redis
    volumes:
      - ./backend:/app
      - ./shared:/shared
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      target: deps
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
