# -----------------------------------------------------------------------------
# CD: Build + deploy backend to Azure Container Apps
# Triggers on push to main when backend/ files change, after CI passes.
# Uses OIDC (federated credentials) -- no long-lived secrets.
# -----------------------------------------------------------------------------
name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"

permissions:
  id-token: write # Required for OIDC
  contents: read

# Prevent concurrent deploys to the same environment
concurrency:
  group: deploy-backend-prod
  cancel-in-progress: false

env:
  # These are non-secret values — set in GitHub repo variables, not secrets
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  CONTAINER_APP_NAME: ${{ vars.BACKEND_CONTAINER_APP_NAME }}
  IMAGE_NAME: entraperm-backend

jobs:
  # Gate: wait for CI to pass on the same commit
  ci-check:
    name: Verify CI passed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # If CI workflow ran on this commit, it must have succeeded for push to main
      # This is enforced by branch protection rules. This step is a documentation marker.
      - name: CI gate
        run: echo "CI must pass via branch protection before merge to main."

  deploy:
    name: Build and Deploy Backend
    runs-on: ubuntu-latest
    needs: ci-check
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Authenticate to Azure via OIDC — no AZURE_CLIENT_SECRET
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      # Login to ACR using the Azure CLI session (no admin credentials)
      - name: ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}

      # Build and push with git SHA tag — never :latest
      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ github.sha }}"
          FULL_IMAGE="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

          docker build \
            --target prod \
            --tag "${FULL_IMAGE}" \
            ./backend

          docker push "${FULL_IMAGE}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "FULL_IMAGE=${FULL_IMAGE}" >> "$GITHUB_ENV"

      # Update the Container App to use the new image revision
      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image "${{ env.FULL_IMAGE }}"

      # Also update all scheduled jobs (they share the backend image)
      - name: Update scheduled jobs
        run: |
          JOBS=("sync-tenant" "compute-baselines" "detect-drift" "generate-recommendations" "generate-narratives")
          for JOB_SUFFIX in "${JOBS[@]}"; do
            JOB_NAME="job-entraperm-${JOB_SUFFIX}-prod"
            echo "Updating job: ${JOB_NAME}"
            az containerapp job update \
              --name "${JOB_NAME}" \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image "${{ env.FULL_IMAGE }}" || echo "Warning: failed to update ${JOB_NAME}"
          done

      # Smoke test: hit the health endpoint
      - name: Smoke test
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          echo "Backend FQDN: ${FQDN}"

          # Wait for the new revision to become ready (up to 120s)
          for i in $(seq 1 12); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${FQDN}/health" || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (HTTP 200)"
              exit 0
            fi
            echo "Attempt ${i}/12: HTTP ${STATUS}, waiting 10s..."
            sleep 10
          done

          echo "Health check failed after 120s"
          exit 1
