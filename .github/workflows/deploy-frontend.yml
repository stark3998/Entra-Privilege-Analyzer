# -----------------------------------------------------------------------------
# CD: Build + deploy frontend to Azure Container Apps
# Triggers on push to main when frontend/ files change, after CI passes.
# Uses OIDC (federated credentials) -- no long-lived secrets.
# -----------------------------------------------------------------------------
name: Deploy Frontend

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/deploy-frontend.yml"

permissions:
  id-token: write # Required for OIDC
  contents: read

concurrency:
  group: deploy-frontend-prod
  cancel-in-progress: false

env:
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  CONTAINER_APP_NAME: ${{ vars.FRONTEND_CONTAINER_APP_NAME }}
  BACKEND_CONTAINER_APP_NAME: ${{ vars.BACKEND_CONTAINER_APP_NAME }}
  APP_CLIENT_ID: ${{ vars.APP_CLIENT_ID }}
  IMAGE_NAME: entraperm-frontend

jobs:
  ci-check:
    name: Verify CI passed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: CI gate
        run: echo "CI must pass via branch protection before merge to main."

  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest
    needs: ci-check
    environment: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: ACR Login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Resolve backend proxy URL
        run: |
          BACKEND_FQDN=$(az containerapp show \
            --name ${{ env.BACKEND_CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          echo "BACKEND_URL=https://${BACKEND_FQDN}" >> "$GITHUB_ENV"

      # Build and push with git SHA tag — never :latest
      - name: Build and push Docker image
        run: |
          IMAGE_TAG="${{ github.sha }}"
          FULL_IMAGE="${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

          docker build \
            --target prod \
            --build-arg VITE_APP_CLIENT_ID="${{ env.APP_CLIENT_ID }}" \
            --build-arg VITE_TENANT_ID="${{ env.AZURE_TENANT_ID }}" \
            --build-arg VITE_API_BASE_URL="" \
            --build-arg BACKEND_URL="${{ env.BACKEND_URL }}" \
            --tag "${FULL_IMAGE}" \
            ./frontend

          docker push "${FULL_IMAGE}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"
          echo "FULL_IMAGE=${FULL_IMAGE}" >> "$GITHUB_ENV"

      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image "${{ env.FULL_IMAGE }}"

      # Smoke test: check frontend and same-origin proxy respond
      - name: Smoke test
        run: |
          FQDN=$(az containerapp show \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          echo "Frontend FQDN: ${FQDN}"

          ROOT_STATUS="000"
          API_STATUS="000"
          for i in $(seq 1 12); do
            ROOT_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${FQDN}/" || echo "000")
            API_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://${FQDN}/api/healthz" || echo "000")
            if [ "$ROOT_STATUS" = "200" ] && [ "$API_STATUS" = "200" ]; then
              echo "Frontend and same-origin API proxy checks passed"
              exit 0
            fi
            echo "Attempt ${i}/12: root=${ROOT_STATUS}, api=${API_STATUS}, waiting 10s..."
            sleep 10
          done

          echo "Health check failed after 120s (root=${ROOT_STATUS}, api=${API_STATUS})"
          exit 1
