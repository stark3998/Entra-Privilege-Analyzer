[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entra-permissions-analyzer"
version = "0.1.0"
description = "Entra ID Least Privilege Analyzer — backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "azure-cosmos>=4.7.0",
    "azure-identity>=1.17.0",
    "msal>=1.30.0",
    "PyJWT>=2.9.0",
    "cryptography>=43.0.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "azure-monitor-opentelemetry-exporter>=1.0.0b28",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
]

[project.optional-dependencies]
reports = [
    "reportlab>=4.0.0",
    "python-pptx>=1.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
include = ["app*", "jobs*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",  # Depends() in function defaults is standard FastAPI
    "B007",  # Legacy unused loop variables outside active change scope
    "E501",  # Existing long strings and messages are tracked as cleanup debt
    "F841",  # Legacy unused locals outside active change scope
    "N803",  # Existing parameter naming kept for compatibility
    "RUF001",  # Existing ambiguous unicode in user-facing strings
    "RUF003",  # Existing ambiguous unicode in comments
    "RUF059",  # Existing intentionally ignored tuple/unpack values
    "SIM102",  # Existing nested conditionals kept to avoid broad refactors
    "SIM105",  # Existing exception suppression style kept as-is
    "SIM117",  # Existing with-statement shape kept to avoid churn
]
